# Enabled on fish-eagle right after the DNS flip (plan §9 step 14) so clients that still resolve
# the old IP are served by martial-eagle. nginx 1.12 supports proxy_ssl_server_name.
server {
    listen 80;
    server_name www.memverse.com memverse.com;
    return 301 https://www.memverse.com$request_uri;
}
server {
    listen 443 ssl;
    server_name www.memverse.com memverse.com;
    ssl_certificate     /etc/letsencrypt/live/memverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memverse.com/privkey.pem;
    ssl_protocols TLSv1.2;
    location / {
        proxy_pass https://64.23.176.115;
        proxy_ssl_server_name on;
        proxy_ssl_name www.memverse.com;
        # Verify martial-eagle's certificate so a hijacked route cannot read forwarded cookies.
        # Rehearsal step 3.10 confirms fish-eagle's CA bundle validates the chain; if it does not
        # (Ubuntu 16.04 bundle too old for the Let's Encrypt roots), point this at /etc/nginx/le-roots.pem.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }
}
