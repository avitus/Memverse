# ROLLBACK ONLY. Staged (not enabled) on martial-eagle before cutover (FINAL_MIGRATION.md 1.3).
# Enabled during a post-flip rollback (4.2) so clients that already resolve martial-eagle are
# served by fish-eagle while DNS moves back. Mirror of fish-eagle/memverse-proxy.conf.
server {
    listen 80;
    listen [::]:80;
    server_name www.memverse.com memverse.com;
    return 301 https://www.memverse.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.memverse.com memverse.com;
    ssl_certificate     /etc/letsencrypt/live/memverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memverse.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass https://192.241.205.154;
        proxy_ssl_server_name on;
        proxy_ssl_name www.memverse.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_read_timeout 120s;
    }
}
