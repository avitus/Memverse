# ROLLBACK ONLY. Staged (not enabled) on martial-eagle as /etc/nginx/sites-available/memverse-maintenance
# (FINAL_MIGRATION.md 1.3). Replacing the `memverse` vhost with this one is how martial-eagle stops taking
# web writes during a rollback (4.1 and 4.2), before fish-eagle is reopened. Mirror of
# fish-eagle/memverse-maintenance.conf; the ACME location keeps certificate renewal working.
server {
    listen 80;
    listen [::]:80;
    server_name www.memverse.com memverse.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.memverse.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.memverse.com memverse.com;
    ssl_certificate     /etc/letsencrypt/live/memverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/memverse.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/maintenance;
    error_page 503 @maintenance;
    location / { return 503; }
    location @maintenance { add_header Retry-After 1800 always; rewrite ^ /index.html break; }
}
