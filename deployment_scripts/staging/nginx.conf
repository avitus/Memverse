server {
    listen 80;
    listen [::]:80;
    server_name staging.memverse.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://staging.memverse.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.memverse.com;
    ssl_certificate /etc/letsencrypt/live/staging.memverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.memverse.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /home/avitus/staging.memverse.com/current/public;
    access_log /var/log/nginx/memverse_staging_access.log;
    error_log /var/log/nginx/memverse_staging_error.log error;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    passenger_enabled on;
    passenger_ruby /home/avitus/.rvm/wrappers/ruby-3.2.6/ruby;
    passenger_app_env staging;
    passenger_app_group_name memverse_staging;
    passenger_max_instances 1;
    passenger_min_instances 0;
    passenger_env_var REDIS_URL redis://127.0.0.1:6381/0;
    passenger_env_var NEW_RELIC_AGENT_ENABLED false;

    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; }
    location /assets/ {
        gzip_static on;
        expires 1d;
    }
    error_page 500 502 503 504 /500.html;
}
