<!DOCTYPE html>
<html>
<head>
    <title>Apostrophe Fix Test - Exodus 20:17</title>
    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script src="app/assets/javascripts/memverse_lib.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test-section { margin: 20px 0; padding: 20px; background: #f5f5f5; }
        .result { padding: 10px; margin: 5px 0; }
        .pass { background: #d4edda; }
        .fail { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Apostrophe Fix Test - Exodus 20:17</h1>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="results"></div>
    </div>

    <script>
        // Define scrub_text if not already defined
        if (typeof scrub_text === 'undefined') {
            window.scrub_text = function(text) {
                return text.toLowerCase().replace(/[^0-9a-z\u00BF-\u1FFF\u2C00-\uD7FF]+/g, "");
            };
        }

        // Test cases for Exodus 20:17
        const tests = [
            // Regular neighbor's
            { correct: "neighbor's", input: "neighbor", expected: true, description: "Base word 'neighbor' should match 'neighbor\\'s'" },
            { correct: "neighbor's", input: "neighbors", expected: true, description: "No-apostrophe 'neighbors' should match 'neighbor\\'s'" },
            { correct: "neighbor's", input: "neighbor's", expected: true, description: "Exact match should work" },

            // Final word with punctuation
            { correct: "neighbor's.", input: "neighbor", expected: true, description: "Base word should match even with period" },
            { correct: 'neighbor\'s."', input: "neighbor", expected: true, description: "Base word should match even with quotes and period" },

            // Other apostrophe cases
            { correct: "don't", input: "don", expected: true, description: "Base 'don' should match 'don\\'t'" },
            { correct: "can't", input: "can", expected: true, description: "Base 'can' should match 'can\\'t'" },
            { correct: "Jesus'", input: "Jesus", expected: true, description: "Base 'Jesus' should match 'Jesus\\''" },

            // False positive prevention
            { correct: "neighbor's", input: "house", expected: false, description: "Should not match unrelated words" },
            { correct: "don't", input: "do", expected: false, description: "Should not match partial unrelated words" }
        ];

        // Run tests
        const results = document.getElementById('results');
        tests.forEach(test => {
            const actual = flexibleTextMatch(test.correct, test.input);
            const passed = actual === test.expected;

            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✅ PASS' : '❌ FAIL'}:</strong> ${test.description}<br>
                Correct: "${test.correct}" | User input: "${test.input}" |
                Expected: ${test.expected} | Actual: ${actual}
            `;
            results.appendChild(resultDiv);
        });

        // Test with actual Exodus 20:17 text
        const exodusText = '"You shall not covet your neighbor\'s house; you shall not covet your neighbor\'s wife, or his male servant, or his female servant, or his ox, or his donkey, or anything that is your neighbor\'s."';
        const neighborCount = (exodusText.match(/neighbor's/g) || []).length;

        const summaryDiv = document.createElement('div');
        summaryDiv.className = 'result';
        summaryDiv.innerHTML = `<h3>Exodus 20:17 Summary</h3>
            <p>The word "neighbor's" appears ${neighborCount} times in the verse.</p>
            <p>With this fix, users can now type just "neighbor" (without the apostrophe) and it will match all ${neighborCount} instances.</p>`;
        results.appendChild(summaryDiv);
    </script>
</body>
</html>
