# NOTE: Check the Cron tab in the Sidekiq UI to find the scheduled jobs

# https://crontab.guru

# IMPORTANT: These are plain Sidekiq::Worker classes, NOT ActiveJob classes
# Must explicitly set active_job: false to prevent sidekiq-cron from trying to use perform_later

# IMPORTANT: sidekiq-cron silently ignores keys it does not know (for example `active: false`).
# The ONLY way to switch an entry off while keeping it here is `status: disabled`.
# Entries deleted from this file are destroyed in Redis when the scheduler boots, because
# config/initializers/sidekiq.rb loads this file with Sidekiq::Cron::Job.load_from_hash!.
# Do not add test schedules to this file; see documentation/SIDEKIQ.md
# for how to run a one-off quiz safely. spec/config/sidekiq_schedule_spec.rb enforces all of this.

# This is the main twice-weekly quiz
# Runs Tuesday at 9am and Saturday at 3pm. Use UTC time
schedule_knowledge_quiz_tuesday:
  cron: "0 17 * * 2 UTC"
  class: "KnowledgeQuiz"
  queue: critical      # Critical priority - user-facing live quiz
  active_job: false    # Explicitly mark as Sidekiq::Worker

schedule_knowledge_quiz_saturday:
  cron: "0 23 * * 6 UTC"
  class: "KnowledgeQuiz"
  queue: critical      # Critical priority - user-facing live quiz
  active_job: false    # Explicitly mark as Sidekiq::Worker

schedule_forum_review_notifier:
  cron: "0 8 * * * UTC"   # 8am every day
  class: "ForumReviewNotifier"
  queue: high          # High priority - user notifications
  active_job: false    # Explicitly mark as Sidekiq::Worker

schedule_refresh_tag_cloud:
  cron: "5 1 1 3,9 * UTC"   # 1:05am on the 1st of March and Sept
  class: "RefreshTagCloud"
  queue: low           # Low priority - maintenance task
  active_job: false    # Explicitly mark as Sidekiq::Worker

schedule_send_reminders:
  cron: "0 * * * * UTC"   # Every hour
  class: "SendReminders"
  queue: high          # High priority - important for user engagement
  active_job: false    # Explicitly mark as Sidekiq::Worker

schedule_update_metrics:
  cron: "0 12 * * * UTC"   # noon every day
  class: "UpdateMetrics"
  queue: default       # Default priority - regular maintenance
  active_job: false    # Explicitly mark as Sidekiq::Worker

# Run twice per year the day before passages are subsectioned
schedule_update_subsections:
  cron: "5 1 1 3,9 * UTC"   # 1:05am on the 1st of March and Sept
  class: "UpdateSubsections"
  queue: low           # Low priority - infrequent maintenance
  active_job: false    # Explicitly mark as Sidekiq::Worker

# Run twice per year the day after verse end probabilities are updated
schedule_subsection_passages:
  cron: "5 1 2 3,9 * UTC"   # 1:05am on the 2nd of March and Sept
  class: "SubsectionPassages"
  queue: low           # Low priority - infrequent maintenance
  active_job: false    # Explicitly mark as Sidekiq::Worker

