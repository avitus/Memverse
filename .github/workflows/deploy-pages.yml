name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - pwa
    paths:
      - "Memverse.Pwa/**"
      - "Memverse.Core/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PWA source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set Pages base path
        run: sed -i 's|<base href="/" />|<base href="/Memverse/" />|' Memverse.Pwa/wwwroot/index.html

      - name: Publish PWA
        run: >
          dotnet publish
          Memverse.Pwa/Memverse.Pwa.csproj
          --configuration Release
          --output publish

      - name: Add SPA fallback
        # Pages serves this document at the original URL, preserving OAuth query parameters.
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
