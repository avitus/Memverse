version: 2.1

# Test suites run through CircleCI Smarter Testing (`circleci testsuite run`); they are defined in
# .circleci/test-suites.yml. list-tests picks the tests each job will run, and the
# experimental.dynamic-parallelism stanza at the bottom sizes the rspec and cucumber jobs to fit.

executors:
  rails-test:
    docker:

      # App Server
      - image: cimg/ruby:3.2.6-browsers
        environment:
          BUNDLE_JOBS: 3
          BUNDLE_RETRY: 3
          BUNDLE_PATH: vendor/bundle
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DB_HOST: 127.0.0.1
          RAILS_ENV: test
          MYSQL_ROOT_PASSWORD: demo
          # config/database.yml defaults to 5 s; build 1031 timed out in db:schema:load on the first CREATE TABLE.
          MYSQL_READ_TIMEOUT: 30
          MYSQL_WRITE_TIMEOUT: 30

      # Database - MySQL 8.0 matches the martial-eagle production target (Ubuntu 24.04 ships 8.0.x);
      # production was 5.7 on fish-eagle until the 2026-10 migration.
      - image: mysql:8.0
        # Native AIO can fail on shared CI hosts (io_setup() EAGAIN), aborting InnoDB at startup.
        # mysql_native_password keeps the readiness check working with the MariaDB-flavoured
        # default-mysql-client installed below; the app itself is fine with caching_sha2_password.
        command: ["--innodb-use-native-aio=0", "--default-authentication-plugin=mysql_native_password"]
        environment:
          MYSQL_ROOT_PASSWORD: demo
          MYSQL_DATABASE: memverse_test
          MYSQL_ALLOW_EMPTY_PASSWORD: true

      - image: redis:6-alpine

commands:
  rails-setup:
    description: Check out the app, install gems, and bring up MySQL, Redis and assets for the test suites
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:UMuaEcfwEEAc5T38Fdx7qxeB3dMyR0TJIZCzStQkp3s circleci@memverse.com"

      - checkout

      - run:
          name: Install/Update Bundler
          command: |
            gem install bundler -v '~> 2.0'
            bundle config set --local deployment 'false'

      - run:
          name: Install MySQL client
          command: |
            # Remove Chrome repo to avoid GPG key issues (Chrome is pre-installed in browsers image)
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y default-mysql-client

      # Which version of bundler?
      - run:
          name: Which bundler?
          command: |
            echo "Bundler version:"
            bundle -v
            echo "Ruby version:"
            ruby -v

      # Restore bundle cache
      - restore_cache:
          keys:
            - memverse-{{ checksum "Gemfile.lock" }}

      - run:
          name: Bundle Install
          command: |
            bundle check || bundle install --jobs=3 --retry=3

      # Store bundle cache
      - save_cache:
          key: memverse-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      # Restore apt cache to speed up package installation
      - restore_cache:
          keys:
            - apt-cache-v1-{{ arch }}

      # Generate asset checksum for better cache invalidation
      - run:
          name: Generate asset checksum
          command: |
            # Create a checksum of all asset files for cache key
            find app/assets -type f -name "*.scss" -o -name "*.css" -o -name "*.js" -o -name "*.coffee" | \
              sort | xargs cat | md5sum > asset_checksum.txt
            echo "Asset checksum: $(cat asset_checksum.txt)"

      # Restore precompiled assets
      - restore_cache:
          keys:
            # Use asset checksum for precise cache invalidation
            - assets-cache-v3-{{ checksum "asset_checksum.txt" }}-{{ checksum "Gemfile.lock" }}
            - assets-cache-v3-{{ checksum "Gemfile.lock" }}
            - assets-cache-v3-

      - run:
          name: Wait for DB
          command: |
            # Bounded wait: if the MySQL container died, fail fast instead of hitting the job timeout
            for i in {1..60}; do
              if timeout 5 mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1; then
                echo "MySQL is ready!"
                exit 0
              fi
              echo "Waiting for MySQL to be ready... (attempt $i/60)"
              if [ "$i" -lt 60 ]; then sleep 2; fi
            done
            echo "MySQL did not become ready after 60 attempts (check the mysql container log)"
            exit 1

      - run:
          name: Verify Database Configuration
          command: |
            echo "Testing database connection..."
            mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SHOW DATABASES;"

      - run:
          name: Database Setup (Optimized)
          command: |
            # Combine database setup into a single step to reduce overhead
            RAILS_ENV=test bundle exec rake db:create db:schema:load --trace

      # Precompile assets once on container 0
      - run:
          name: Asset Precompilation
          command: |
            if [ "$CIRCLE_NODE_INDEX" = "0" ]; then
              if [ ! -d "public/assets" ] || [ ! -f "public/assets/.cache_marker" ]; then
                echo "Precompiling assets on container 0..."
                RAILS_ENV=test bundle exec rake assets:precompile
                touch public/assets/.cache_marker
              else
                echo "Using cached precompiled assets"
              fi
            else
              echo "Waiting for assets from container 0..."
              # Wait up to 60 seconds for assets to be available
              for i in {1..12}; do
                if [ -f "public/assets/.cache_marker" ]; then
                  echo "Assets ready!"
                  break
                fi
                sleep 5
              done
            fi

      - run:
          name: Install Redis CLI
          command: |
            # Redis CLI is only needed for tests that use background jobs
            # For now, install on all containers but could be optimized further
            if command -v redis-cli &> /dev/null; then
              echo "Redis CLI already installed"
            else
              sudo apt-get update --allow-releaseinfo-change
              sudo apt-get install -y redis-tools
            fi

      - run:
          name: Wait for Redis with verification
          command: |
            for i in {1..30}; do
              if redis-cli -h localhost ping > /dev/null 2>&1; then
                echo "Redis is ready!"
                redis-cli -h localhost INFO server | head -n 5
                break
              fi
              echo "Waiting for Redis... (attempt $i/30)"
              sleep 2
            done

            # Verify Redis is actually working
            redis-cli -h localhost SET test_key "test_value"
            TEST_VALUE=$(redis-cli -h localhost GET test_key)
            if [ "$TEST_VALUE" = "test_value" ]; then
              echo "Redis verification successful!"
            else
              echo "Redis verification failed!"
              exit 1
            fi
            redis-cli -h localhost DEL test_key

  save-rails-caches:
    description: Save the apt and precompiled asset caches
    steps:
      # Save apt cache
      - save_cache:
          key: apt-cache-v1-{{ arch }}
          paths:
            - /var/cache/apt/archives
          when: on_success

      # Save precompiled assets (only from container 0)
      - run:
          name: Prepare assets for caching
          command: |
            if [ "$CIRCLE_NODE_INDEX" = "0" ] && [ -d "public/assets" ]; then
              echo "Assets will be cached from container 0"
            fi

      - save_cache:
          key: assets-cache-v3-{{ checksum "asset_checksum.txt" }}-{{ checksum "Gemfile.lock" }}
          paths:
            - public/assets
            - tmp/cache/assets
          when: on_success

jobs:
  # Lists the tests rspec and cucumber will run (all on main, impacted ones on other branches),
  # which dynamic parallelism uses to size those jobs. Discovery is a `find`, so no app setup.
  list-tests:
    docker:
      - image: cimg/base:2026.09
    steps:
      - checkout
      - run:
          name: List RSpec tests
          command: circleci testsuite list-tests "rspec" --key=rspec-parallelism
      - run:
          name: List Cucumber tests
          command: circleci testsuite list-tests "cucumber" --key=cucumber-parallelism

  rspec:
    executor: rails-test
    # Fallback when dynamic parallelism can't be applied; also its maximum
    parallelism: 6
    steps:
      - rails-setup
      - save-rails-caches

      # No --fail-fast: rerunning failed tests needs a result for every spec file
      - run:
          name: Rspec tests
          command: circleci testsuite run "rspec"

      - store_test_results:
          path: test_results

  cucumber:
    executor: rails-test
    # Fallback when dynamic parallelism can't be applied; also its maximum
    parallelism: 6
    steps:
      - rails-setup

      # Restore ChromeDriver cache to avoid re-downloading
      - restore_cache:
          keys:
            - chromedriver-cache-v3-{{ arch }}

      - run:
          name: Verify Chrome and ChromeDriver
          command: |
            # cimg/ruby:3.2.6-browsers ships Chrome and ChromeDriver; Capybara drives Chrome with
            # --headless=new (features/support/capybara.rb), so no X server is needed
            echo "Chrome version: $(google-chrome --version || echo 'Chrome not found')"
            echo "ChromeDriver version: $(chromedriver --version || echo 'ChromeDriver not found')"
            google-chrome --headless --disable-gpu --no-sandbox --remote-debugging-port=9222 --disable-dev-shm-usage --version

      - save_cache:
          key: chromedriver-cache-v3-{{ arch }}
          paths:
            - /usr/local/bin/chromedriver
          when: on_success

      - save-rails-caches

      # Flaky scenarios get Cucumber's --retry 2, then up to 2 reruns of their feature file
      # (max-auto-rerun in test-suites.yml)
      - run:
          name: Cucumber tests
          command: circleci testsuite run "cucumber"
          no_output_timeout: 30m

      - store_test_results:
          path: test_results

  vitest:
    docker:
      # Same Node as the cimg/ruby:3.2.6-browsers image Vitest used to run on
      - image: cimg/node:20.18.0

    steps:
      - checkout

      - run:
          name: Install Node.js dependencies
          command: |
            # The committed node_modules and package-lock.json are stale; install fresh
            rm -rf node_modules package-lock.json
            npm install

            # Explicitly install Linux-specific Rollup binding (npm optional deps bug workaround)
            # See: https://github.com/npm/cli/issues/4828
            npm install @rollup/rollup-linux-x64-gnu --save-optional

      - run:
          name: JavaScript tests (Vitest)
          command: circleci testsuite run "vitest"
          environment:
            NODE_ENV: test

      - store_test_results:
          path: test_results

# database:
#   post:
#     - sudo cp ./config/environments/sphinx.conf /etc/sphinxsearch/sphinx.conf
#     - sudo sed -i -e 's,START=no,START=yes,' /etc/default/sphinxsearch
#     - service sphinxsearch start

workflows:
  build:
    jobs:
      - list-tests
      - rspec:
          requires:
            - list-tests
      - cucumber:
          requires:
            - list-tests
      - vitest

# Sizes each job from the tests list-tests selected (no target duration), between min and max.
# Experimental: CircleCI will replace this syntax.
experimental:
  dynamic-parallelism:
    rspec:
      key: rspec-parallelism
      min: 1
      max: 6
    cucumber:
      key: cucumber-parallelism
      min: 1
      max: 6
