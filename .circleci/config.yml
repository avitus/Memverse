version: 2.1

orbs:
  ruby: circleci/ruby@2.1.0
  node: circleci/node@5.2.0

executors:
  rails-executor:
    docker:
      - image: cimg/ruby:3.2.6-browsers
        environment:
          BUNDLE_JOBS: 4
          BUNDLE_RETRY: 3
          BUNDLE_PATH: vendor/bundle
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DB_HOST: 127.0.0.1
          RAILS_ENV: test
          MYSQL_ROOT_PASSWORD: demo
      - image: library/mysql:5.7
        environment:
          MYSQL_ROOT_PASSWORD: demo
          MYSQL_DATABASE: memverse_test
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-host-cache, --skip-name-resolve]
      - image: redis:6-alpine
    resource_class: large
    working_directory: ~/project

jobs:
  setup:
    executor: rails-executor
    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:UMuaEcfwEEAc5T38Fdx7qxeB3dMyR0TJIZCzStQkp3s circleci@memverse.com"
      - checkout

      # Install system dependencies
      - run:
          name: Install System Dependencies
          command: |
            sudo rm -f /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y default-mysql-client redis-tools xvfb --fix-missing || echo "Some optional packages skipped"

      # Bundler setup
      - run:
          name: Install/Update Bundler
          command: |
            gem install bundler -v '~> 2.0'
            bundle config set --local deployment 'false'

      - run:
          name: Which bundler?
          command: |
            echo "Bundler version:"
            bundle -v
            echo "Ruby version:"
            ruby -v

      # Restore and install Ruby dependencies
      - restore_cache:
          keys:
            - memverse-{{ checksum "Gemfile.lock" }}

      - run:
          name: Bundle Install
          command: bundle check || bundle install --jobs=4 --retry=3

      - save_cache:
          key: memverse-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      # Restore and install Node.js dependencies
      - restore_cache:
          keys:
            - memverse-node-v3-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
            - memverse-node-v3-{{ checksum "package.json" }}
            - memverse-node-v3-

      - run:
          name: Install Node.js dependencies
          command: |
            echo "Node version: $(node --version)"
            echo "NPM version: $(npm --version)"

            if [ -f "node_modules/.package-lock-marker" ] && \
               cmp -s package-lock.json node_modules/.package-lock-marker 2>/dev/null; then
              echo "Using cached node_modules"
            else
              echo "Installing node_modules..."
              rm -rf node_modules
              npm ci --prefer-offline
              npm install @rollup/rollup-linux-x64-gnu --save-optional
              cp package-lock.json node_modules/.package-lock-marker
            fi

            npx vitest --version || exit 1

      - save_cache:
          key: memverse-node-v3-{{ checksum "package.json" }}-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      # Wait for database
      - run:
          name: Wait for DB
          command: |
            for i in {1..90}; do
              if mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1; then
                echo "MySQL is ready!"
                break
              fi
              echo "Waiting for MySQL... (attempt $i/90)"
              sleep 2
            done
            mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1 || {
              echo "ERROR: MySQL failed to become ready after 3 minutes"
              exit 1
            }

      # Database setup
      - run:
          name: Database Setup
          command: RAILS_ENV=test bundle exec rake db:create db:schema:load --trace

      # Generate asset checksum
      - run:
          name: Generate asset checksum
          command: |
            find app/assets -type f \( -name "*.scss" -o -name "*.css" -o -name "*.js" -o -name "*.coffee" \) | \
              sort | xargs cat | md5sum > asset_checksum.txt
            echo "Asset checksum: $(cat asset_checksum.txt)"

      # Restore precompiled assets
      - restore_cache:
          keys:
            - assets-cache-v3-{{ checksum "asset_checksum.txt" }}-{{ checksum "Gemfile.lock" }}
            - assets-cache-v3-{{ checksum "Gemfile.lock" }}
            - assets-cache-v3-

      # Precompile assets
      - run:
          name: Asset Precompilation
          command: |
            if [ -d "public/assets" ] && [ -f "public/assets/.cache_marker" ]; then
              echo "Using cached precompiled assets"
            else
              echo "Precompiling assets..."
              RAILS_ENV=test bundle exec rake assets:precompile
              touch public/assets/.cache_marker
            fi

      - save_cache:
          key: assets-cache-v3-{{ checksum "asset_checksum.txt" }}-{{ checksum "Gemfile.lock" }}
          paths:
            - public/assets
            - tmp/cache/assets

      # Wait for Redis
      - run:
          name: Wait for Redis
          command: |
            for i in {1..30}; do
              if redis-cli -h localhost ping > /dev/null 2>&1; then
                echo "Redis is ready!"
                redis-cli -h localhost INFO server | head -n 5
                break
              fi
              echo "Waiting for Redis... (attempt $i/30)"
              sleep 2
            done
            redis-cli -h localhost SET test_key "test_value"
            [ "$(redis-cli -h localhost GET test_key)" = "test_value" ] && echo "Redis verified!"
            redis-cli -h localhost DEL test_key

      # Persist workspace for test jobs
      - persist_to_workspace:
          root: ~/project
          paths:
            - .
            - vendor/bundle
            - node_modules
            - public/assets

  rspec:
    executor: rails-executor
    parallelism: 3
    steps:
      - attach_workspace:
          at: ~/project

      - run:
          name: Wait for DB
          command: |
            for i in {1..90}; do
              if mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1; then
                echo "MySQL is ready!"
                break
              fi
              echo "Waiting for MySQL... (attempt $i/90)"
              sleep 2
            done
            mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1 || {
              echo "ERROR: MySQL failed to become ready after 3 minutes"
              exit 1
            }

      - run:
          name: Wait for Redis
          command: |
            for i in {1..30}; do
              if redis-cli -h localhost ping > /dev/null 2>&1; then
                echo "Redis is ready!"
                break
              fi
              echo "Waiting for Redis... (attempt $i/30)"
              sleep 2
            done

      - run:
          name: RSpec tests
          command: |
            bundle exec rspec --fail-fast \
                              --profile 10 \
                              --format RspecJunitFormatter \
                              --out test_results/rspec.xml \
                              --format progress \
                              $(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)

      - store_test_results:
          path: test_results

  cucumber:
    executor: rails-executor
    parallelism: 3
    steps:
      - attach_workspace:
          at: ~/project

      - run:
          name: Verify Chrome and ChromeDriver
          command: |
            echo "Chrome version: $(google-chrome --version)"
            echo "ChromeDriver version: $(chromedriver --version)"
            google-chrome --headless --disable-gpu --no-sandbox --remote-debugging-port=9222 --disable-dev-shm-usage --version

      - run:
          name: Wait for DB
          command: |
            for i in {1..90}; do
              if mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1; then
                echo "MySQL is ready!"
                break
              fi
              echo "Waiting for MySQL... (attempt $i/90)"
              sleep 2
            done
            mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1 || {
              echo "ERROR: MySQL failed to become ready after 3 minutes"
              exit 1
            }

      - run:
          name: Wait for Redis
          command: |
            for i in {1..30}; do
              if redis-cli -h localhost ping > /dev/null 2>&1; then
                echo "Redis is ready!"
                break
              fi
              echo "Waiting for Redis... (attempt $i/30)"
              sleep 2
            done

      - run:
          name: Start Xvfb
          command: |
            if command -v Xvfb &> /dev/null; then
              Xvfb :99 -ac -screen 0 1280x1024x16 &
              sleep 2
            fi
          background: true

      - run:
          name: Cucumber tests
          command: |
            mkdir -p ~/cucumber test_results
            export CI=true
            export CUCUMBER_TIMEOUT=600
            export RAILS_ENV=test
            export DISPLAY=:99

            FEATURES=$(circleci tests glob "features/**/*.feature" | circleci tests split --split-by=timings)

            if [ -z "$FEATURES" ]; then
              echo "No features assigned"
              touch test_results/cucumber.xml
              exit 0
            fi

            echo "Running features:"
            echo "$FEATURES" | tr ' ' '\n'

            timeout 25m bundle exec cucumber $FEATURES \
              --format progress \
              --format junit --out test_results/cucumber.xml \
              --strict-undefined \
              --retry 2 \
              --no-source
          no_output_timeout: 30m

      - store_test_results:
          path: test_results

  vitest:
    executor: rails-executor
    steps:
      - attach_workspace:
          at: ~/project

      - run:
          name: Vitest JavaScript tests
          command: |
            export NODE_ENV=test
            npm run test:run || {
              echo "Vitest tests failed"
              npx vitest --version
              exit 1
            }

      - store_test_results:
          path: test_results

workflows:
  version: 2
  build_and_test:
    jobs:
      - setup
      - rspec:
          requires:
            - setup
      - cucumber:
          requires:
            - setup
      - vitest:
          requires:
            - setup
