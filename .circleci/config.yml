version: 2
jobs:
  build:
    
    parallelism: 4
    
    docker:

      # App Server
      - image: cimg/ruby:3.2.6-browsers
        environment:
          BUNDLE_JOBS: 3
          BUNDLE_RETRY: 3
          BUNDLE_PATH: vendor/bundle
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DB_HOST: 127.0.0.1
          RAILS_ENV: test
          MYSQL_ROOT_PASSWORD: demo

      # Database
      - image: library/mysql:5.7
        environment:
          MYSQL_ROOT_PASSWORD: demo
          MYSQL_DATABASE: memverse_test
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306

      - image: redis:6-alpine

    steps:
      - add_ssh_keys:
          fingerprints:
            - "SHA256:UMuaEcfwEEAc5T38Fdx7qxeB3dMyR0TJIZCzStQkp3s circleci@memverse.com"

      - checkout

      - run:
          name: Install/Update Bundler
          command: |
            gem install bundler -v '~> 2.0'
            bundle config set --local deployment 'false'

      - run: 
          name: Install MySQL client
          command: |
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y default-mysql-client

      # Which version of bundler?
      - run:
          name: Which bundler?
          command: |
            echo "Bundler version:"
            bundle -v
            echo "Ruby version:"
            ruby -v

      # Restore bundle cache
      - restore_cache:
          keys:
            - memverse-{{ checksum "Gemfile.lock" }}

      - run:
          name: Bundle Install
          command: |
            bundle check || bundle install --jobs=3 --retry=3

      # Store bundle cache
      - save_cache:
          key: memverse-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      # Restore node_modules cache
      - restore_cache:
          keys:
            - memverse-node-{{ checksum "package.json" }}
            - memverse-node-

      # Only necessary if app uses webpacker or yarn in some other way
      # - restore_cache:
      #     keys:
      #       - rails-demo-yarn-{{ checksum "yarn.lock" }}
      #       - rails-demo-yarn-

      # ALV: For now we are going to stick with the old school asset pipeline
      # Eventually, we should switch to Yarn (and/or webpacker)

      # - run:
      #     name: Yarn Install
      #     command: yarn install

      # Store yarn / webpacker cache
      # - save_cache:
      #     key: rails-demo-yarn-{{ checksum "yarn.lock" }}
      #     paths:
      #       - ~/.yarn-cache

      # Install Chrome dependencies and setup matching ChromeDriver
      - run:
          name: Setup Chrome and ChromeDriver
          command: |
            # Install additional dependencies for headless Chrome
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y \
              libgconf-2-4 \
              libxss1 \
              libappindicator1 \
              libindicator7 \
              wget \
              unzip \
              jq
            
            # Detect installed Chrome version
            echo "Detecting Chrome version..."
            CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+\.\d+')
            echo "Chrome version detected: $CHROME_VERSION"
            
            # Get the major version for ChromeDriver compatibility
            CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d. -f1)
            echo "Chrome major version: $CHROME_MAJOR_VERSION"
            
            # Function to download ChromeDriver with retries
            download_chromedriver() {
              local url=$1
              local max_retries=3
              local retry_count=0
              
              while [ $retry_count -lt $max_retries ]; do
                echo "Attempt $((retry_count + 1)) of $max_retries: Downloading ChromeDriver..."
                if wget -O chromedriver.zip "$url"; then
                  echo "ChromeDriver download successful!"
                  return 0
                else
                  echo "Download failed, retrying in 5 seconds..."
                  sleep 5
                  retry_count=$((retry_count + 1))
                fi
              done
              
              echo "Failed to download ChromeDriver after $max_retries attempts"
              return 1
            }
            
            # Download and install matching ChromeDriver using Chrome for Testing API
            echo "Using Chrome for Testing API to find ChromeDriver for Chrome $CHROME_MAJOR_VERSION..."
            
            # Try to get ChromeDriver version from Chrome for Testing API with retries
            for attempt in 1 2 3; do
              echo "Attempt $attempt: Fetching Chrome for Testing API data..."
              if API_RESPONSE=$(curl -s --connect-timeout 10 --max-time 30 "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json"); then
                echo "API response received successfully"
                break
              else
                echo "API request failed, retrying in 5 seconds..."
                sleep 5
                if [ $attempt -eq 3 ]; then
                  echo "Failed to fetch API data after 3 attempts"
                  exit 1
                fi
              fi
            done
            
            # Parse JSON to find the latest ChromeDriver for the installed Chrome major version
            CHROMEDRIVER_URL=$(echo "$API_RESPONSE" | jq -r --arg major "$CHROME_MAJOR_VERSION" '
              .versions[] | 
              select(.version | startswith($major + ".")) | 
              .downloads.chromedriver[]? | 
              select(.platform == "linux64") | 
              .url' | tail -n 1)
            
            if [ -z "$CHROMEDRIVER_URL" ] || [ "$CHROMEDRIVER_URL" = "null" ]; then
              echo "Could not find ChromeDriver for Chrome $CHROME_MAJOR_VERSION using Chrome for Testing API"
              echo "Trying to find the latest stable version..."
              
              # Fallback: get the latest stable ChromeDriver
              CHROMEDRIVER_URL=$(echo "$API_RESPONSE" | jq -r '
                .versions[] | 
                select(.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$")) | 
                .downloads.chromedriver[]? | 
                select(.platform == "linux64") | 
                .url' | tail -n 1)
            fi
            
            if [ -z "$CHROMEDRIVER_URL" ] || [ "$CHROMEDRIVER_URL" = "null" ]; then
              echo "ERROR: Could not determine ChromeDriver download URL"
              echo "API Response (first 1000 chars): $(echo "$API_RESPONSE" | head -c 1000)"
              exit 1
            fi
            
            echo "ChromeDriver download URL: $CHROMEDRIVER_URL"
            
            # Extract version from URL for verification
            CHROMEDRIVER_VERSION=$(echo "$CHROMEDRIVER_URL" | grep -oP '/\K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(?=/)')
            echo "ChromeDriver version to install: $CHROMEDRIVER_VERSION"
            
            # Download ChromeDriver with retries
            if ! download_chromedriver "$CHROMEDRIVER_URL"; then
              echo "ERROR: Failed to download ChromeDriver"
              exit 1
            fi
            
            # Install ChromeDriver
            echo "Installing ChromeDriver..."
            unzip -q chromedriver.zip
            
            # Handle different archive structures
            if [ -f "chromedriver" ]; then
              CHROMEDRIVER_BINARY="chromedriver"
            elif [ -f "chromedriver-linux64/chromedriver" ]; then
              CHROMEDRIVER_BINARY="chromedriver-linux64/chromedriver"
            else
              echo "ERROR: Could not find ChromeDriver binary in archive"
              ls -la
              exit 1
            fi
            
            chmod +x "$CHROMEDRIVER_BINARY"
            sudo mv "$CHROMEDRIVER_BINARY" /usr/local/bin/chromedriver
            
            # Clean up
            rm -rf chromedriver.zip chromedriver-linux64 chromedriver 2>/dev/null || true
            
            # Verify installation
            echo "Verifying Chrome and ChromeDriver installation..."
            google-chrome --version
            chromedriver --version
            
            # Verify version compatibility
            INSTALLED_CHROMEDRIVER_VERSION=$(chromedriver --version | grep -oP '\d+\.\d+\.\d+\.\d+')
            echo "Installed ChromeDriver version: $INSTALLED_CHROMEDRIVER_VERSION"
            
            CHROMEDRIVER_MAJOR=$(echo "$INSTALLED_CHROMEDRIVER_VERSION" | cut -d. -f1)
            if [ "$CHROMEDRIVER_MAJOR" != "$CHROME_MAJOR_VERSION" ]; then
              echo "WARNING: ChromeDriver major version ($CHROMEDRIVER_MAJOR) does not match Chrome major version ($CHROME_MAJOR_VERSION)"
              echo "This may cause compatibility issues, but continuing..."
            else
              echo "SUCCESS: ChromeDriver and Chrome major versions match!"
            fi
            
            # Test that Chrome can run in headless mode
            echo "Testing headless Chrome..."
            google-chrome --headless --disable-gpu --no-sandbox --remote-debugging-port=9222 --disable-dev-shm-usage --version

      - run:
          name: Wait for DB
          command: |
            until mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SELECT 1" >/dev/null 2>&1; do
              echo "Waiting for MySQL to be ready..."
              sleep 2
            done

      - run:
          name: Verify Database Configuration
          command: |
            echo "Testing database connection..."
            mysql -h 127.0.0.1 -P 3306 -u root -pdemo -e "SHOW DATABASES;"

      - run:
          name: Database (Create)
          command: RAILS_ENV=test bundle exec rake db:create

      - run:
          name: Database (Load Schema)
          command: RAILS_ENV=test bundle exec rake db:schema:load

      - run:
          name: Database (Prepare)
          command: RAILS_ENV=test bundle exec rake db:test:prepare

      - run:
          name: Install Redis CLI
          command: |
            sudo apt-get update --allow-releaseinfo-change
            sudo apt-get install -y redis-tools

      - run:
          name: Wait for Redis with verification
          command: |
            for i in {1..30}; do
              if redis-cli -h localhost ping > /dev/null 2>&1; then
                echo "Redis is ready!"
                redis-cli -h localhost INFO server | head -n 5
                break
              fi
              echo "Waiting for Redis... (attempt $i/30)"
              sleep 2
            done
            
            # Verify Redis is actually working
            redis-cli -h localhost SET test_key "test_value"
            TEST_VALUE=$(redis-cli -h localhost GET test_key)
            if [ "$TEST_VALUE" = "test_value" ]; then
              echo "Redis verification successful!"
            else
              echo "Redis verification failed!"
              exit 1
            fi
            redis-cli -h localhost DEL test_key

      # Run rspec in parallel
      - type: shell
        name: Rspec tests
        command: |
          bundle exec rspec --profile 10 \
                            --format RspecJunitFormatter \
                            --out test_results/rspec.xml \
                            --format progress \
                            $(circleci tests glob "spec/**/*_spec.rb" | circleci tests split --split-by=timings)

      # Install Node.js dependencies for Vitest
      - run:
          name: Install Node.js dependencies
          command: |
            # Remove corrupted node_modules if they exist (but keep package-lock.json)
            if [ -d "node_modules" ]; then
              echo "Removing existing node_modules directory to ensure clean state..."
              rm -rf node_modules
            fi
            
            # Clear npm cache to prevent potential corruption issues
            echo "Clearing npm cache..."
            npm cache clean --force
            
            # Use npm ci for deterministic, faster installs in CI
            echo "Installing dependencies with npm ci..."
            npm ci --no-optional || {
              echo "npm ci failed, attempting to fix native module issues..."
              
              # Force install the specific rollup platform module that's missing
              echo "Installing @rollup/rollup-linux-x64-gnu explicitly..."
              npm install @rollup/rollup-linux-x64-gnu --no-save --force || true
              
              # Rebuild native modules to ensure compatibility
              echo "Rebuilding native modules..."
              npm rebuild || true
              
              # Retry npm ci
              echo "Retrying npm ci..."
              npm ci --no-optional
            }
            
            # Verify Vitest installation
            echo "Verifying Vitest installation..."
            npx vitest --version || {
              echo "Vitest verification failed, attempting to fix..."
              npm install vitest --no-save --force
              npx vitest --version
            }
            
            echo "Node.js dependencies installation completed successfully"

      # Store node_modules cache
      - save_cache:
          key: memverse-node-{{ checksum "package.json" }}
          paths:
            - node_modules

      # Run Vitest JavaScript tests
      - run:
          name: JavaScript tests (Vitest)
          command: |
            # Set NODE_ENV for test environment
            export NODE_ENV=test
            
            # Run tests with error handling
            echo "Running Vitest tests..."
            npm run test:run || {
              echo "Vitest tests failed, checking installation..."
              npx vitest --version
              echo "Node modules structure:"
              ls -la node_modules/.bin/ | grep vitest || echo "vitest not found in .bin"
              exit 1
            }
          when: always

      # Run cucumber with optimized settings and parallelization
      - run:
          name: Cucumber tests 
          command: |
            mkdir -p ~/cucumber 
            mkdir -p test_results
            # Set environment variables for CI
            export CI=true
            export CUCUMBER_TIMEOUT=300
            
            # Run non-JavaScript features first (faster with transaction strategy)
            echo "Running non-JavaScript Cucumber features..."
            bundle exec cucumber features --tags 'not @javascript' \
              --format progress \
              --format junit --out test_results/cucumber_non_js.xml \
              --retry 1
            
            # Run JavaScript features separately with more retries
            echo "Running JavaScript Cucumber features..."
            bundle exec cucumber features --tags '@javascript' \
              --format progress \
              --format junit --out test_results/cucumber_js.xml \
              --retry 2 || true
            
            # Combine results
            cat test_results/cucumber_*.xml > test_results/cucumber.xml || true
          when: always
          no_output_timeout: 30m

      # Save test results for timing analysis
      - store_test_results:
          path: test_results

